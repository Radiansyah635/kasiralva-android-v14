name: Build KasirAlva APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KasirAlva-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    # Hanya jalan kalau secret keystore sudah diisi di repo (Settings > Secrets and variables > Actions)
    if: ${{ vars.HAS_RELEASE_KEYSTORE == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore
        run: echo "${{ secrets.KASIRALVA_KEYSTORE_BASE64 }}" | base64 -d > kasiralva-release.keystore

      - name: Build Release APK
        env:
          KASIRALVA_KEYSTORE_PATH: ${{ github.workspace }}/kasiralva-release.keystore
          KASIRALVA_KEYSTORE_PASSWORD: ${{ secrets.KASIRALVA_KEYSTORE_PASSWORD }}
          KASIRALVA_KEY_ALIAS: ${{ secrets.KASIRALVA_KEY_ALIAS }}
          KASIRALVA_KEY_PASSWORD: ${{ secrets.KASIRALVA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Remove keystore file
        if: always()
        run: rm -f kasiralva-release.keystore

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: KasirAlva-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
