name: Build KasirAlva APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KasirAlva-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    # Jalan jika variable HAS_RELEASE_KEYSTORE=true ATAU dijalankan manual (Run workflow)
    if: ${{ vars.HAS_RELEASE_KEYSTORE == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check release secrets
        env:
          KS_B64: ${{ secrets.KASIRALVA_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KASIRALVA_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KASIRALVA_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KASIRALVA_KEY_PASSWORD }}
        run: |
          missing=0
          if [ -z "$KS_B64" ]; then echo "::error::Secret KASIRALVA_KEYSTORE_BASE64 kosong"; missing=1; fi
          if [ -z "$KS_PASS" ]; then echo "::error::Secret KASIRALVA_KEYSTORE_PASSWORD kosong"; missing=1; fi
          if [ -z "$KS_ALIAS" ]; then echo "::error::Secret KASIRALVA_KEY_ALIAS kosong"; missing=1; fi
          if [ -z "$KEY_PASS" ]; then echo "::error::Secret KASIRALVA_KEY_PASSWORD kosong"; missing=1; fi
          if [ "$missing" = "1" ]; then
            echo "Isi 4 secret di: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Semua secret release terdeteksi."

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.KASIRALVA_KEYSTORE_BASE64 }}
        run: |
          # Buang whitespace/newline yang sering bikin base64 gagal
          echo "$KS_B64" | tr -d '\n\r\t ' | base64 -d > kasiralva-release.keystore
          if [ ! -s kasiralva-release.keystore ]; then
            echo "::error::Gagal decode keystore (file kosong). Cek KASIRALVA_KEYSTORE_BASE64."
            exit 1
          fi
          # Cek magic bytes keystore (JKS / PKCS12)
          file kasiralva-release.keystore || true
          ls -la kasiralva-release.keystore
          echo "Keystore decoded OK ($(wc -c < kasiralva-release.keystore) bytes)"

      - name: Verify keystore unlock
        env:
          KASIRALVA_KEYSTORE_PASSWORD: ${{ secrets.KASIRALVA_KEYSTORE_PASSWORD }}
          KASIRALVA_KEY_ALIAS: ${{ secrets.KASIRALVA_KEY_ALIAS }}
          KASIRALVA_KEY_PASSWORD: ${{ secrets.KASIRALVA_KEY_PASSWORD }}
        run: |
          keytool -list \
            -keystore kasiralva-release.keystore \
            -storepass "$KASIRALVA_KEYSTORE_PASSWORD" \
            -alias "$KASIRALVA_KEY_ALIAS" \
            -keypass "$KASIRALVA_KEY_PASSWORD" || {
              echo "::error::Password / alias keystore salah. Cek KASIRALVA_KEYSTORE_PASSWORD, KASIRALVA_KEY_ALIAS, KASIRALVA_KEY_PASSWORD."
              exit 1
            }
          echo "Keystore bisa dibuka — alias OK."

      - name: Build Release APK
        env:
          KASIRALVA_KEYSTORE_PATH: ${{ github.workspace }}/kasiralva-release.keystore
          KASIRALVA_KEYSTORE_PASSWORD: ${{ secrets.KASIRALVA_KEYSTORE_PASSWORD }}
          KASIRALVA_KEY_ALIAS: ${{ secrets.KASIRALVA_KEY_ALIAS }}
          KASIRALVA_KEY_PASSWORD: ${{ secrets.KASIRALVA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Remove keystore file
        if: always()
        run: rm -f kasiralva-release.keystore

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: KasirAlva-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
