name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KASIRALVA_KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Build Android Release
        env:
          KASIRALVA_KEYSTORE_PATH: release.keystore
          KASIRALVA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KASIRALVA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KASIRALVA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KasirAlva-Release-APK
          path: app/build/outputs/apk/release/*.apk
